# Posts hot deals (TELEGRAM_CHAT_ID) and a daily cashback digest (TELEGRAM_CASHBACK_CHAT_ID) to two Telegram
# channels (scripts/telegram-channel.mjs).
# Scheduled runs do nothing until the TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets are added.
# Run it manually without those secrets for a dry run that prints the messages instead of posting.
name: telegram channel

on:
  # GitHub often starts scheduled runs hours late or drops them, so each mode has two backup slots.
  # The script posts once per UTC day per mode: later slots skip once a mode has posted.
  schedule:
    - cron: "7 12 * * *" # deals, 12:07 UTC
    - cron: "7 15 * * *" # deals, backup
    - cron: "7 18 * * *" # deals, backup
    - cron: "37 12 * * *" # cashback boosts, 12:37 UTC
    - cron: "37 15 * * *" # cashback boosts, backup
    - cron: "37 18 * * *" # cashback boosts, backup
  workflow_dispatch:
    inputs:
      mode:
        description: "deals | boosts | check (diagnose the Telegram setup)"
        required: true
        default: deals
        type: choice
        options: [deals, boosts, check]

permissions:
  contents: read

concurrency:
  group: telegram-channel-${{ inputs.mode || (startsWith(github.event.schedule, '37 ') && 'boosts' || 'deals') }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CASHBACK_CHAT_ID: ${{ secrets.TELEGRAM_CASHBACK_CHAT_ID }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
      REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
      REDDIT_SUBREDDIT: ${{ secrets.REDDIT_SUBREDDIT }}
      MODE: ${{ inputs.mode || (startsWith(github.event.schedule, '37 ') && 'boosts' || 'deals') }}
      ONCE_PER_DAY: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - name: Skip scheduled runs until the channel is set up
        if: github.event_name == 'schedule' && (env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == '')
        run: echo "::notice::Telegram secrets not set; skipping scheduled post."
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || (env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '')
      - uses: actions/setup-node@v4
        if: github.event_name != 'schedule' || (env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '')
        with:
          node-version: 22
      - run: node scripts/telegram-channel.mjs "$MODE"
        if: github.event_name != 'schedule' || (env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '')
